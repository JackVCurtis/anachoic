id: MCP-15
title: "Assignment in the tools, wait_for_work and the board props for workers"
area: MCP
phase: "2"
summary: >
  Expose assignment: add_task takes assign_to (a session id or name), add_task_from_view takes
  assignTo, claim_step follows the new rules, and a new worker tool wait_for_work waits until the
  queue holds a task the caller may claim. Board props gain each task's assignedTo and the list of
  live workers, and the texts name assignments.
requirements:
  - "add_task gains optional assign_to, matched against live workers by id or by display name (case-insensitive); an ambiguous or unknown name is refused with invalid naming the live workers"
  - "add_task_from_view gains optional assignTo (a session id) and its result is the fresh board props as before"
  - "wait_for_work: polls firstClaimable every 2 s, sends a progress notification every 60 s with the request's progressToken, returns as soon as there is work naming the task (\"T-012 is assigned to you. Call claim_step with task T-012.\" or \"T-015 is in the queue. Call claim_step with task T-015.\"), and after 20 minutes returns \"No work yet. Call wait_for_work again to keep waiting.\"; it reuses the wait timings and their test variables from MCP-11"
  - "wait_for_work from the dedicated session is refused with invalid; a cancelled call stops polling"
  - "shared/props.ts: every task reference in the board props carries assignedTo {id, name} or null, and BoardProps gains workers [{id, name}] (live workers); both are backward compatible additions"
  - "The board summary appends \"→ <name>\" to an assigned task; claim_step's text says when the claimed task is assigned to the caller"
  - "The worker instructions and tool descriptions (server/instructions.ts) add: with nothing to do, call wait_for_work and keep calling it until it returns work; the dedicated instructions say add_task can assign to a live worker by name"
acceptance_criteria:
  - "Integration suite: two worker processes; a task assigned to one is refused to the other with the sentence, and claim_step() by the other skips it"
  - "Integration suite: wait_for_work returns within one poll when a task is assigned to the caller, sends progress at the shortened interval, returns its own timeout text, and is refused for the dedicated client"
  - "Integration suite: add_task with assign_to by name and by id; an unknown name is refused listing the live workers"
  - "Unit suite: board props carry assignedTo and workers; the summary shows the arrow and stays within its token budget"
depends_on:
  - "DOM-08"
  - "MCP-11"
external_dependencies: []
