id: PKG-04
title: "Local release package - icon, one version, and a README for daily use"
area: PKG
phase: "4"
summary: >
  Finish the desktop extension and the worker plugin so they can be relied on every day, for local use
  only: the app is not published, signed or listed anywhere. Add the icon, keep one version number for
  the package, the manifest, the plugin and the server, and write a README that covers installing,
  the dedicated session, the prompts, workers, updating, data and logs. Installing a newer .mcpb keeps the board, migrates it, and makes a worker on an older
  build refuse with a message that says to update.
requirements:
  - "Add mcpb/icon.png, a plain 512 x 512 PNG, and name it in the manifest's icon field; pack copies it into the extension"
  - "The data directory stays fixed at the server's default (no user_config setting), so desktop and the worker plugin always share one board; the manifest sets no ANACHOIC_DATA_DIR override"
  - "package.json's version is the one version: scripts/pack.mjs writes it into the manifest and the plugin it packs, and the server reports it as its serverInfo version and in its start log line"
  - "A database migrated by a newer build makes an older server refuse to start with a sentence that says a newer version of the server owns the database and to update, as 04 requires"
  - "Rewrite README.md for local use: what the app is; that it is not published; installing anachoic.mcpb; the Board and History prompts; installing the anachoic-worker plugin from plugin/ and starting workers with /worker; updating both after a new pack (marketplace update, plugin update, reinstalling the .mcpb, restarting); the data folder; where logs are; the development loop"
  - "The README states that every desktop chat that uses the server counts as the dedicated session, and that the views are light only"
acceptance_criteria:
  - "`pnpm run pack` passes mcpb validate, and the packed manifest's version equals package.json's"
  - "Integration test: a server started against a database whose user_version is ahead of its migrations exits non-zero with the update sentence on stderr"
  - "Manual desktop check: the icon shows in Settings → Extensions"
  - "Manual desktop check: installing a newer .mcpb over the old one keeps every task, and a worker still running the older server file refuses with the update sentence"
depends_on:
  - "PKG-02"
  - "MCP-13"
external_dependencies:
  - "Claude desktop on macOS, for the manual check"
  - "Claude Code, for the worker step of the README check"
docs:
  - "08-packaging-and-hosts.md#the-desktop-extension"
  - "08-packaging-and-hosts.md#worker-sessions"
  - "08-packaging-and-hosts.md#logs"
  - "04-persistence.md#migrations"
  - "04-persistence.md#the-data-directory"
  - "09-testing-and-build-order.md#phase-4-hardening"
  - "05-sessions.md#identity"
