id: MCP-05
title: "show_board and get_board for an empty board, with the view fetching on connect"
area: MCP
phase: "0"
summary: >
  Add the first view tool and the first app-only tool, both answering with an empty board, and wire
  the board entry so it draws from get_board rather than from the tool result the host replays. This
  closes phase 0's path: show_board draws the empty BoardView in desktop chat and gives Claude Code a
  text result. There is no store yet; MCP-08 replaces the empty board with the real one.
requirements:
  - "shared/props.ts declares BoardProps with every field of 06's board props (revision, now, yourTurn, working, queue, backlog, toSignOff, signedOff, sessions, counts) and GetBoardResult as either {changed: false, revision} or the board props"
  - "server/props/empty_board.ts builds the empty board: revision 0, now, every list empty and every count 0"
  - "show_board is registered with registerAppTool, no input, and _meta.ui.resourceUri ui://anachoic/board.html; it returns one text block with the board summary and the board props as structuredContent, checked by a zod output schema"
  - "server/text/board_summary.ts writes the summary in 06's format; for the empty board it is 'Board, revision 0' followed by each list with a count of 0"
  - "get_board is registered with _meta.ui.visibility ['app'] and an optional sinceRevision; it returns {changed: false, revision} when sinceRevision equals the current revision, else the board props, as structuredContent with a short text block"
  - "view/entries/board/main.tsx connects through the host bridge, ignores the replayed tool result for drawing, calls get_board on connect and maps the result to BoardView's own props"
  - "Until the first get_board returns, the entry draws nothing that could be mistaken for the board; it does not poll, which UIS-07 adds"
acceptance_criteria:
  - "Integration suite: tools/list shows show_board with _meta.ui.resourceUri and the legacy _meta['ui/resourceUri'] key, and get_board with visibility ['app']"
  - "Integration suite: show_board returns one text block starting 'Board, revision 0' and structuredContent that parses as BoardProps; get_board with sinceRevision 0 returns {changed: false, revision: 0}"
  - "UI suite, with a fake App: given a replayed result whose props differ, the board entry draws what get_board returned, and calls get_board exactly once on connect"
  - "UI suite: the board entry's story with the empty board passes the axe check"
  - "Manual, in the reference host with pnpm dev: calling show_board draws the empty board"
depends_on:
  - "MCP-04"
  - "UIS-01"
external_dependencies: []
docs:
  - "06-tools-and-views.md#view-tools"
  - "06-tools-and-views.md#app-only-tools"
  - "06-tools-and-views.md#board-props"
  - "06-tools-and-views.md#text-results"
  - "06-tools-and-views.md#how-a-view-connects"
  - "06-tools-and-views.md#how-long-a-view-lives"
  - "../spikes/mcp-apps/notes.md#1-49-15-and-16-claude-desktop-chat"
