id: UIS-19
title: "Output formats in TaskEntry and the follow-up composer, the artifact field on your-turn cards, and artifact links on the cards"
area: UIS
phase: "2"
summary: >
  A step you own can declare an output format when it is entered; your-turn cards then ask for the
  artifact link before Mark done; and each task's cards show its artifact links, opened through the
  host.
requirements:
  - "The chain composer (shared by TaskEntry and the follow-up composer) gains a labelled native select \"Output\" on steps owned by you, with None, Pull request, Ticket, Document and Link; it is hidden for agent steps and cleared when a step's owner changes to agent"
  - "YourTurnCard for a step with a format shows \"Needs a <format> link\" and its Mark done form gains a required URL field labelled from the formats table in 11, above the note; Mark done is disabled until the field holds an absolute http(s) URL, with a polite note saying why"
  - "The entry sends artifactUrl with complete_my_step and posts the wake sentence with the URL from MCP-16; a refusal keeps the draft and shows the error strip"
  - "Working, Queue, Backlog and SignOffCard draw one line of artifact links \"Pull request · step 2 ↗\", each a button-styled link that calls the host's openLink through the bridge; the ↗ is aria-hidden and each link has hidden text \"opens in your browser\""
  - "Long URLs never widen a card: link text is the format and step only, with the full URL in the title attribute"
  - "New strings follow the content rules; the strings test passes"
acceptance_criteria:
  - "ui suite: the Output select appears only for your steps, is cleared on owner change, and its value is sent per step"
  - "ui suite: Mark done stays disabled without a valid URL and sends artifactUrl when valid; a refusal keeps the draft"
  - "ui suite: artifact links call openLink with the URL through a fake App"
  - "Stories: a your-turn card needing a pull request link, cards with artifacts; every story passes the axe check at 735 and 600 px"
  - "Manual desktop check: complete a step with a pull request link; the link appears on the task's card, opens in the browser, and the next worker reads it"
depends_on:
  - "UIS-09"
  - "UIS-12"
  - "MCP-16"
external_dependencies: []
docs:
