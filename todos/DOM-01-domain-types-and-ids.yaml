  - "03-domain-model.md#step"
  - "03-domain-model.md#session"
  - "03-domain-model.md#event"
  - "03-domain-model.md#refusals"
  - "06-tools-and-views.md#model-tools"
  - "02-stack-and-structure.md#copied-files"
  - "anachoic:app/05-persistence.md#how-t-nnn-ids-are-issued"
